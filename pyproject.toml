[project]
name = "ieee-ai-chatbot"
version = "0.1.0"
description = "RAG chatbot for IEEE SB knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.20,<7",
    "langchain>=1.2,<2",
    "langchain-community>=0.4,<1",
    "langchain-core>=1.2,<2",
    "langchain-google-genai>=4.2,<5",
    "langchain-pinecone>=0.2,<1",
    "langchain-text-splitters>=1.1,<2",
    "pinecone>=5,<7",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "beautifulsoup4>=4.14,<5",
    "python-docx>=1.2,<2",
    "pypdf>=5,<7",
    "python-pptx>=1.0,<2",
    "unstructured>=0.21,<1",
    "langsmith>=0.3,<1",
    "watchdog>=6,<7",
    "matplotlib>=3.10,<4",
    "lxml>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2,<3",
]
